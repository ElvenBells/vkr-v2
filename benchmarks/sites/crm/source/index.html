<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic CRM Benchmark v1.0</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 4rem; }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.3rem; font-weight: 700; }
        .controls { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
        .search-input { padding: 0.6rem 0.9rem; border: 1px solid var(--border); border-radius: 6px; width: 260px; font-size: 0.9rem; }
        .search-input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        .btn { padding: 0.6rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        
        .table-container { max-width: 1100px; margin: 1.5rem auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 0.9rem 1.2rem; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { background: #f8fafc; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        .data-table tbody tr:hover { background: #f1f5f9; cursor: pointer; }
        .contact-info { display: flex; align-items: center; gap: 0.8rem; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #475569; }
        .name { font-weight: 600; }
        .email { font-size: 0.85rem; color: var(--text-muted); }
        
        .badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; display: inline-block; }
        .badge-active { background: #ecfdf5; color: var(--success); }
        .badge-lead { background: #fef3c7; color: var(--warning); }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-card { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); transform: translateY(10px); transition: transform 0.2s; }
        .modal-overlay.open .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.4rem; }
        .form-input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.5rem; }

        .status-bar { text-align: center; padding: 1.2rem; color: var(--text-muted); font-size: 0.85rem; margin-top: 1rem; }
    </style>
</head>
<body>

    <header class="header" id="header" data-testid="header-panel">
        <h1>Contact Management</h1>
        <div class="controls">
            <input type="text" id="search-input" class="search-input" placeholder="Поиск по имени..." data-testid="search-input">
            <button id="add-contact-btn" class="btn btn-primary" data-testid="add-contact-btn">+ Добавить контакт</button>
        </div>
    </header>

    <main class="table-container" id="table-container" data-testid="contact-table-container">
        <table class="data-table" id="contact-table">
            <thead>
                <tr>
                    <th>Контакт</th>
                    <th>Роль</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="contact-tbody">
                </tbody>
        </table>
    </main>

    <div class="status-bar" id="status-bar" data-testid="status-bar" data-dynamic="true">
        Показано: <span id="visible-count">0</span> | Обновлено: <span id="last-sync">--:--</span>
    </div>

    <div class="modal-overlay" id="contact-modal" data-testid="contact-modal">
        <div class="modal-card" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h2 id="modal-title">Новый контакт</h2>
                <button class="close-btn" id="modal-close" aria-label="Закрыть">&times;</button>
            </div>
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="form-name">Имя *</label>
                    <input type="text" id="form-name" class="form-input" required data-testid="form-name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="form-email">Email *</label>
                    <input type="email" id="form-email" class="form-input" required data-testid="form-email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="form-role">Роль</label>
                    <input type="text" id="form-role" class="form-input" value="Client" data-testid="form-role">
                </div>
                <div class="form-group">
                    <label class="form-label" for="form-status">Статус</label>
                    <select id="form-status" class="form-input" data-testid="form-status">
                        <option value="active">Active</option>
                        <option value="lead">Lead</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="modal-cancel">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="modal-save">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        let contacts = [
            { id: 1, name: 'Alice Cooper', email: 'alice@example.com', role: 'Key Account', status: 'active' },
            { id: 2, name: 'Bob Singer', email: 'bob@example.com', role: 'Prospect', status: 'lead' }
        ];

        const tbody = document.getElementById('contact-tbody');
        const searchInput = document.getElementById('search-input');
        const countEl = document.getElementById('visible-count');
        
        function renderTable(query = '') {
            tbody.innerHTML = '';
            const filtered = contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()));
            
            filtered.forEach(c => {
                const tr = document.createElement('tr');
                const initials = c.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
                tr.innerHTML = `
                    <td>
                        <div class="contact-info">
                            <div class="avatar">${initials}</div>
                            <div>
                                <div class="name">${c.name}</div>
                                <div class="email">${c.email}</div>
                            </div>
                        </div>
                    </td>
                    <td>${c.role}</td>
                    <td><span class="badge badge-${c.status}">${c.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
            countEl.innerText = filtered.length;
            document.getElementById('last-sync').innerText = new Date().toLocaleTimeString();
        }

        renderTable();
        searchInput.addEventListener('input', (e) => renderTable(e.target.value));

        // Modal Logic
        const modal = document.getElementById('contact-modal');
        const btnAdd = document.getElementById('add-contact-btn');
        const btnClose = document.getElementById('modal-close');
        const btnCancel = document.getElementById('modal-cancel');
        const form = document.getElementById('contact-form');

        function toggleModal(show) {
            if (show) {
                modal.classList.add('open');
                form.reset();
            } else {
                modal.classList.remove('open');
            }
        }

        btnAdd.addEventListener('click', () => toggleModal(true));
        btnClose.addEventListener('click', () => toggleModal(false));
        btnCancel.addEventListener('click', () => toggleModal(false));

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('form-name').value;
            const email = document.getElementById('form-email').value;
            
            if (!name || !email) return; // Простая валидация

            contacts.push({
                id: Date.now(),
                name: name,
                email: email,
                role: document.getElementById('form-role').value,
                status: document.getElementById('form-status').value
            });
            
            toggleModal(false);
            renderTable(searchInput.value);
        });
    });
    </script>
    
    <script>
    window.benchmark = {
        mutateDOM: () => { document.querySelector('table').remove(); },
        mutateCSS: () => { document.documentElement.style.setProperty('--primary', '#ff0000'); },
        mutateText: () => { document.querySelector('h1').innerText = 'ERROR CRM'; },
        mutateSemantic: () => { document.querySelectorAll('.badge-active').forEach(e => e.className = 'badge badge-archived'); },
        mutateContrast: () => { document.body.style.filter = 'contrast(0.6)'; },
        mutateThemeVars: () => { document.documentElement.style.setProperty('--bg', '#1a1a2e'); },
        mutateState: () => { document.getElementById('add-contact-btn').disabled = true; },
        mutateAnimation: () => { document.head.insertAdjacentHTML('beforeend', '<style>* { transition: none !important; }</style>'); },
        mutateOCR: () => { document.getElementById('visible-count').innerText = '9999'; }
    };
    </script>
</body>
</html>
