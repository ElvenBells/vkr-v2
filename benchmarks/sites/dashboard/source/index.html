<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic Dashboard Benchmark v1.0</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #e2e8f0;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 3rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border); gap: 1rem; }
        .header h1 { font-size: 1.4rem; font-weight: 700; }
        .header-controls { display: flex; gap: 0.75rem; align-items: center; }
        .dropdown, .btn { padding: 0.5rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { background: #f8fafc; }
        .live-clock { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 0.85rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
        .kpi-card { background: var(--card-bg); padding: 1.2rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); transition: transform 0.2s; }
        .kpi-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.3rem; }
        .kpi-trend { font-size: 0.85rem; font-weight: 600; padding: 0.15rem 0.4rem; border-radius: 4px; }
        .trend-up { color: var(--success); background: #ecfdf5; }
        .trend-down { color: var(--danger); background: #fef2f2; }

        .table-section { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
        .table-header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 0.8rem 1.2rem; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { background: #f8fafc; cursor: pointer; user-select: none; font-weight: 600; color: var(--text-muted); }
        .data-table th:hover { color: var(--primary); }
        .data-table tbody tr:hover { background: #f1f5f9; }
        .status-badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; }
        .st-active { background: #ecfdf5; color: var(--success); }
        .st-pending { background: #fef3c7; color: var(--warning); }
    </style>
</head>
<body>

    <header class="header" id="header" data-testid="header-panel">
        <h1>Analytics Overview</h1>
        <div class="header-controls">
            <select id="period-filter" class="dropdown" data-testid="period-select">
                <option value="7d">Last 7 Days</option>
                <option value="30d" selected>Last 30 Days</option>
                <option value="90d">Last 90 Days</option>
            </select>
            <button id="refresh-btn" class="btn" data-testid="refresh-btn">⟳ Refresh Data</button>
        </div>
        <div class="live-clock" id="live-clock" data-testid="clock" data-dynamic="true">Last sync: Just now</div>
    </header>

    <main class="container">
        <section class="kpi-grid" id="kpi-section" data-testid="kpi-grid">
            <article class="kpi-card" data-testid="kpi-card-revenue">
                <div class="kpi-title">Total Revenue</div>
                <div class="kpi-value" id="val-revenue">₽1,245,000</div>
                <span class="kpi-trend trend-up" id="trend-revenue">▲ 12.5%</span>
            </article>
            <article class="kpi-card" data-testid="kpi-card-users">
                <div class="kpi-title">Active Users</div>
                <div class="kpi-value" id="val-users">8,432</div>
                <span class="kpi-trend trend-up" id="trend-users">▲ 8.1%</span>
            </article>
            <article class="kpi-card" data-testid="kpi-card-conversion">
                <div class="kpi-title">Conversion Rate</div>
                <div class="kpi-value" id="val-conversion">3.4%</div>
                <span class="kpi-trend trend-down" id="trend-conversion">▼ 0.4%</span>
            </article>
            <article class="kpi-card" data-testid="kpi-card-sessions">
                <div class="kpi-title">Avg. Session</div>
                <div class="kpi-value" id="val-sessions">4m 12s</div>
                <span class="kpi-trend trend-up" id="trend-sessions">▲ 1.8%</span>
            </article>
        </section>

        <section class="table-section" id="table-section" data-testid="table-container">
            <div class="table-header">
                <span>Recent Transactions</span>
            </div>
            <table class="data-table" id="data-table">
                <thead>
                    <tr>
                        <th data-sort="id">ID ↕</th>
                        <th data-sort="product">Product ↕</th>
                        <th data-sort="amount">Amount (₽) ↕</th>
                        <th data-sort="status">Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </section>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // KPI Data Mock
        const kpiData = {
            '7d': { rev: '₽324,500', users: '2,150', conv: '4.2%', sess: '3m 50s' },
            '30d': { rev: '₽1,245,000', users: '8,432', conv: '3.4%', sess: '4m 12s' },
            '90d': { rev: '₽4,890,200', users: '26,800', conv: '2.8%', sess: '5m 05s' }
        };

        const periodSelect = document.getElementById('period-filter');
        periodSelect.addEventListener('change', (e) => {
            const data = kpiData[e.target.value];
            document.getElementById('val-revenue').innerText = data.rev;
            document.getElementById('val-users').innerText = data.users;
            document.getElementById('val-conversion').innerText = data.conv;
            document.getElementById('val-sessions').innerText = data.sess;
        });

        // Table Data Mock
        let transactions = [
            { id: 'TRX-001', product: 'Premium Subscription', amount: 5000, status: 'active' },
            { id: 'TRX-002', product: 'Basic Plan', amount: 1500, status: 'pending' },
            { id: 'TRX-003', product: 'Enterprise Setup', amount: 25000, status: 'active' }
        ];

        const tbody = document.getElementById('table-body');
        
        function renderTable() {
            tbody.innerHTML = '';
            transactions.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.id}</td>
                    <td>${t.product}</td>
                    <td style="font-weight:600;">${t.amount.toLocaleString()} ₽</td>
                    <td><span class="status-badge st-${t.status}">${t.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable();

        // Refresh Logic
        document.getElementById('refresh-btn').addEventListener('click', () => {
            document.getElementById('live-clock').innerText = `Last sync: ${new Date().toLocaleTimeString()}`;
            transactions = [...transactions].reverse(); // Fake update by reversing
            renderTable();
        });

        // Simple sorting
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.getAttribute('data-sort');
                transactions.sort((a, b) => a[key] > b[key] ? 1 : -1);
                renderTable();
            });
        });
    });
    </script>
    
    <script>
    window.benchmark = {
        mutateDOM: () => { const card = document.querySelector('.kpi-card'); if (card) card.remove(); },
        mutateCSS: () => { document.documentElement.style.setProperty('--primary', '#ff0000'); },
        mutateText: () => { document.querySelector('h1').innerText = 'ERROR DASHBOARD'; },
        mutateSemantic: () => { document.querySelectorAll('.st-active').forEach(e => e.className = 'status-badge st-pending'); },
        mutateContrast: () => { document.body.style.filter = 'contrast(0.6)'; },
        mutateThemeVars: () => { document.documentElement.style.setProperty('--bg', '#1a1a2e'); },
        mutateState: () => { document.getElementById('refresh-btn').disabled = true; },
        mutateAnimation: () => { const s = document.createElement('style'); s.innerText = '* { transition: none !important; }'; document.head.appendChild(s); },
        mutateOCR: () => { document.getElementById('val-revenue').innerText = '0 ₽'; }
    };
    </script>
</body>
</html>
