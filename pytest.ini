[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --tb=short 
    --strict-markers 
    --timeout=120 
    --alluredir=reports/allure-results
markers =
    cv: Tests for CV-AI agent
    pw: Tests for Playwright baseline
    defect: Tests with injected defects
    performance: Performance & overhead tests
log_cli = true
log_cli_level = INFO